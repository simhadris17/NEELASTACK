apiVersion: apps/v1
kind: Deployment
metadata:
  name: neelastack-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: neelastack-api}
  template:
    metadata: {labels: {app: neelastack-api}}
    spec:
      containers:
      - name: api
        image: neelastack/api:latest
        ports: [{containerPort: 8000}]
