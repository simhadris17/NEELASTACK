apiVersion: apps/v1
kind: Deployment
metadata:
  name: neelastack-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: neelastack-api}
  template:
    metadata: {labels: {app: neelastack-api}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: api
        image: neelastack/api:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom:
        - configMapRef: {name: neelastack-config}
        - secretRef: {name: neelastack-secret}
        readinessProbe:
          httpGet: {path: /health/ready, port: 8000}
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities: {drop: ["ALL"]}
