apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neelastack-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: neelastack-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
