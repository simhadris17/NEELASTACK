name: Evaluation
on: [push]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: python -m pip install --upgrade pip
    - run: python -m pip install -e ".[dev]"
    - run: python -m pytest packages/neelastack/evaluations -q
