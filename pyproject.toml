
[project]
name = "neelastack"
version = "0.1.0"
description = "Local-first AI platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "redis",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "argon2-cffi",
    "python-jose",
    "email-validator",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
